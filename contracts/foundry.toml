[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
amoy = "${AMOY_RPC_URL}"

[etherscan]
# Polygonscan retired its own per-chain API in favor of Etherscan's unified V2 API
amoy = { key = "${POLYGONSCAN_API_KEY}", chain = 80002 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
